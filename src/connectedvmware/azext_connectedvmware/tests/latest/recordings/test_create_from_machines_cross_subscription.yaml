- request:
    body: '{"subscriptions": ["00000000-0000-0000-0000-000000000000", "11111111-1111-1111-1111-111111111111"],
      "query": " Resources | where subscriptionId =~ ''00000000-0000-0000-0000-000000000000''
      | where resourceGroup =~ ''azcli-machine-integration-test'' | where id =~ ''/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/azcli-machine-integration-test/providers/Microsoft.HybridCompute/machines/test-vm-azcli''
      | where type =~ ''Microsoft.HybridCompute/machines'' | where isempty(kind) or
      kind =~ ''VMware'' | extend p=parse_json(properties) | extend u = tolower(tostring(p[''vmUuid'']))
      | where isnotempty(u) | where location =~ ''eastus2euap'' | extend vmUuidRev
      = strcat(     substring(u, 6, 2), substring(u, 4, 2), substring(u, 2, 2), substring(u,
      0, 2), ''-'',     substring(u, 11, 2), substring(u, 9, 2), ''-'',     substring(u,
      16, 2), substring(u, 14, 2), ''-'',     substring(u, 19)) | extend vmUuid=pack_array(u,
      vmUuidRev) | mv-expand vmUuid | extend vmUuid=tostring(vmUuid) | project machineId=id,
      name, resourceGroup, vmUuid, kind | join kind=inner ( ConnectedVMwareVsphereResources
      | where type =~ ''Microsoft.ConnectedVMwareVsphere/VCenters/InventoryItems''
      | where kind =~ ''VirtualMachine'' | where id startswith ''/subscriptions/11111111-1111-1111-1111-111111111111/resourceGroups/azcli-integration-test/providers/microsoft.connectedvmwarevsphere/vcenters/azcli-vcenter-scenario/InventoryItems''
      | extend p=parse_json(properties) | extend biosId = tolower(tostring(p[''smbiosUuid'']))
      | extend managedResourceId=tolower(tostring(p[''managedResourceId''])) | project
      inventoryId=id, biosId, managedResourceId ) on $left.vmUuid == $right.biosId
      | project-away vmUuid", "options": {"allowPartialScopes": false, "authorizationScopeFilter":
      "AtScopeAndBelow"}}'
