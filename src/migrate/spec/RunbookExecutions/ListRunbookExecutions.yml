info:
  name: ListRunbookExecutions
  type: http
  seq: 1

http:
  method: GET
  url: https://management.azure.com/{{MigrateProjectResourceId}}/runbooks/{{RunbookName}}/executions?api-version={{RunbooksAPIVersion}}
  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
