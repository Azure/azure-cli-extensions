info:
  name: DownloadRunbookExecutionStatus
  type: http
  seq: 8

http:
  method: POST
  url: https://management.azure.com/{{MigrateProjectResourceId}}/runbooks/{{RunbookName}}/executions/{{RunbookExecutionName}}/GenerateDownloadUrl?api-version={{RunbooksAPIVersion}}
  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let AdmZip;
        try {
          const admZipModule = require("adm-zip");
          AdmZip = typeof admZipModule === "function"
            ? admZipModule
            : admZipModule?.default;

          if (typeof AdmZip !== "function") {
            throw new Error("adm-zip module did not expose a constructor");
          }
        } catch (innerErr) {
          res.setBody({
            error: "Failed to load adm-zip constructor. Run npm install in src/Utilities/WaveRunbookRestAPI.",
            details: innerErr.message,
            originalResponse: res.getBody()
          });
          return;
        }

        const originalResponseBody = res.getBody();
        const extractSasUrl = (body) => {
          if (!body || typeof body !== "object") {
            return null;
          }

          const directKeys = ["sasUrl", "sasUri", "downloadUrl", "downloadUri", "url", "uri"];
          for (const key of directKeys) {
            if (typeof body[key] === "string" && body[key].length > 0) {
              return body[key];
            }
          }

          if (body.properties && typeof body.properties === "object") {
            for (const key of directKeys) {
              if (typeof body.properties[key] === "string" && body.properties[key].length > 0) {
                return body.properties[key];
              }
            }
          }

          return null;
        };

        const sasUrl = extractSasUrl(originalResponseBody);
        if (!sasUrl) {
          res.setBody({
            error: "SAS URL was not found in the GenerateDownloadUrl response.",
            originalResponse: originalResponseBody
          });
          return;
        }

        const zipDownloadResponse = await bru.sendRequest({
          method: "GET",
          url: sasUrl,
          responseType: "arraybuffer"
        });

        const zipBuffer = Buffer.isBuffer(zipDownloadResponse.data)
          ? zipDownloadResponse.data
          : Buffer.from(zipDownloadResponse.data);

        const zip = new AdmZip(zipBuffer);
        const entries = zip.getEntries().map((entry) => entry.entryName);
        const runbookExecutionEntry = zip.getEntries().find((entry) => {
          const normalized = entry.entryName.replace(/\\/g, "/").toLowerCase();
          return normalized.endsWith("runbookexecution.json");
        });

        if (!runbookExecutionEntry) {
          res.setBody({
            error: "runbookExecution.json was not found in the downloaded ZIP.",
            sasUrl,
            zipEntries: entries,
            originalResponse: originalResponseBody
          });
          return;
        }

        const runbookExecutionJsonText = runbookExecutionEntry.getData().toString("utf8");

        let runbookExecutionJson;
        try {
          runbookExecutionJson = JSON.parse(runbookExecutionJsonText);
        } catch (err) {
          runbookExecutionJson = {
            parseError: err.message,
            rawContent: runbookExecutionJsonText
          };
        }

        res.setBody({
          generateDownloadUrlResponse: originalResponseBody,
          sasUrl,
          extractedFile: runbookExecutionEntry.entryName,
          runbookExecutionJson
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
