info:
  name: PatchRunbookExecution
  type: http
  seq: 4

http:
  method: PATCH
  url: https://management.azure.com/{{MigrateProjectResourceId}}/runbooks/{{RunbookName}}/executions/{{RunbookExecutionName}}?api-version={{RunbooksAPIVersion}}
  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  body:
    type: json
    data: |-
      {
        "status": "Completed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
