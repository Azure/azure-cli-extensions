  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  body:
    type: json
    data: |-
      {
        "sourceWorkstreamId": "workstream-source",
        "stepIds": [
          "step1"
        ],
        "migrationEntityIds": [
          "entity-1"
        ],
        "newWorkstreamName": "new-workstream"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
