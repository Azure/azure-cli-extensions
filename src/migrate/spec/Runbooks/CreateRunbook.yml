info:
  name: CreateRunbook
  type: http
  seq: 1

http:
  method: PUT
  url: https://management.azure.com/{{MigrateProjectResourceId}}/runbooks/{{RunbookName}}?api-version={{RunbooksAPIVersion}}
  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  body:
    type: json
    data: |-
      {
        "properties": {
          "scope": {
            "ScopeType": "Wave",
            "WaveId": "/{{MigrateProjectResourceId}}/waves/wave66"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
