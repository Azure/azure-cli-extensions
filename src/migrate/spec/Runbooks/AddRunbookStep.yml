info:
  name: AddRunbookStep
  type: http
  seq: 7

http:
  method: POST
  url: https://management.azure.com/{{MigrateProjectResourceId}}/runbooks/{{RunbookName}}/AddStep?api-version={{RunbooksAPIVersion}}
  params:
    - name: api-version
      value: "{{RunbooksAPIVersion}}"
      type: query
  body:
    type: json
    data: |-
      {
        "stepName": "step1",
        "displayName": "Step 1",
        "stepRef": "step-ref-1",
        "migrationEntityIds": [
          "entity-1"
        ],
        "dependsOn": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
