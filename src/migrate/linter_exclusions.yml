---
# exclusions for the migrate module

migrate:
    rule_exclusions:
        - missing_group_help

migrate local:
    rule_exclusions:
        - missing_group_help

migrate local replication:
    rule_exclusions:
        - missing_group_help

migrate get-discovered-server:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule
    parameters:
        resource_group_name:
            rule_exclusions:
                - parameter_should_not_end_in_resource_group

migrate local replication init:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule
    parameters:
        resource_group_name:
            rule_exclusions:
                - parameter_should_not_end_in_resource_group

migrate local replication new:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule
    parameters:
        resource_group_name:
            rule_exclusions:
                - parameter_should_not_end_in_resource_group

migrate local replication list:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule

migrate local replication get:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule

migrate local replication get-job:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule

migrate local replication remove:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule

migrate local start-migration:
    rule_exclusions:
        - missing_command_test_coverage
        - missing_parameter_test_coverage
        - missing_command_example
        - missing_command_help
        - unrecognized_help_parameter_rule

# The runbook group binds the global resource_group_name argument, whose
# option list is -g/--resource-group. The test-coverage linter derives the
# option name from the dest (--resource-group-name), which the recordings can
# never match, so this parameter is excluded like the other migrate commands.
migrate runbook:
    parameters:
        resource_group_name:
            rule_exclusions:
                - missing_parameter_test_coverage

# -g/-p are identity/scope parameters that carry a configured_default (set via
# `az configure --defaults group=<rg> migrate_project=<name>`). The
# no-defaults-on-update rule targets update *content* parameters; excluding the
# scope parameters here keeps the linter green when az config defaults are set.
migrate runbook update:
    parameters:
        resource_group_name:
            rule_exclusions:
                - no_parameter_defaults_for_update_commands
        project_name:
            rule_exclusions:
                - no_parameter_defaults_for_update_commands
migrate runbook definition step update:
    parameters:
        resource_group_name:
            rule_exclusions:
                - no_parameter_defaults_for_update_commands
        project_name:
            rule_exclusions:
                - no_parameter_defaults_for_update_commands
