        encrypted-packet processing through Encapsulating Security Payload (ESP) for
        both IP versions, removing the vulnerable decryption path. Legitimate encrypted
        tunnels using this capability will be unavailable; active consumers may prevent
        removal.","isRollbackable":true,"status":"AwaitingApproval"}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/mitigations/CVE-2026-43284-nsisolated11158469-2-prevent-new-user-namespaces","name":"CVE-2026-43284-nsisolated11158469-2-prevent-new-user-namespaces","type":"Microsoft.NetworkSecurity/neuroShields/protectedResources/mitigations","properties":{"findingId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/findings/CVE-2026-43284-nsisolated11158469-2","cveId":"CVE-2026-43284","virtualMachineArmId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.Compute/virtualMachines/nsisolated11158469-2","rank":3,"commandsSummary":"Prevent
        creation of new user namespaces, blocking ordinary local users from obtaining
        the network administration capability (CAP_NET_ADMIN) through that route.
        Rootless containers and other namespace-based sandboxes may stop launching;
        existing namespaces and privileged network configuration remain possible.","isRollbackable":true,"status":"AwaitingApproval"}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/mitigations/CVE-2026-76642-nsisolated11158469-2-block-filesystem-cloning","name":"CVE-2026-76642-nsisolated11158469-2-block-filesystem-cloning","type":"Microsoft.NetworkSecurity/neuroShields/protectedResources/mitigations","properties":{"findingId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/findings/CVE-2026-76642-nsisolated11158469-2","cveId":"CVE-2026-76642","virtualMachineArmId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.Compute/virtualMachines/nsisolated11158469-2","rank":3,"commandsSummary":"Block
        filesystem cloning through the open_tree system call, preventing the documented
        identity-mapped clone from being created. This affects legitimate clone-based
        mount operations across the host and does not stop the separate ownership
        and permission attack.","isRollbackable":true,"status":"AwaitingApproval"}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/mitigations/CVE-2026-76642-nsisolated11158469-2-remove-vulnerable-fstab-hooks","name":"CVE-2026-76642-nsisolated11158469-2-remove-vulnerable-fstab-hooks","type":"Microsoft.NetworkSecurity/neuroShields/protectedResources/mitigations","properties":{"findingId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/findings/CVE-2026-76642-nsisolated11158469-2","cveId":"CVE-2026-76642","virtualMachineArmId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.Compute/virtualMachines/nsisolated11158469-2","rank":1,"commandsSummary":"Remove
        mount-time identity mapping (X-mount.idmap) and ownership or permission adjustment
        (X-mount.owner, X-mount.group, X-mount.mode) from the filesystem table. Ordinary
        mounting remains available, but workloads relying on these adjustments may
        lose access or fail.","isRollbackable":true,"status":"AwaitingApproval"}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/mitigations/CVE-2026-76642-nsisolated11158469-2-restrict-mount-execution-to-root","name":"CVE-2026-76642-nsisolated11158469-2-restrict-mount-execution-to-root","type":"Microsoft.NetworkSecurity/neuroShields/protectedResources/mitigations","properties":{"findingId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/findings/CVE-2026-76642-nsisolated11158469-2","cveId":"CVE-2026-76642","virtualMachineArmId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.Compute/virtualMachines/nsisolated11158469-2","rank":2,"commandsSummary":"Restrict
        the installed mount utility to root so unprivileged users cannot invoke its
        privileged mount operations. This also prevents non-root users from using
        that utility for ordinary mount listings or legitimate user-authorized mounts;
        root-operated mounting remains available.","isRollbackable":true,"status":"AwaitingApproval"}},{"id":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/mitigations/CVE-2026-78410-nsisolated11158469-2-deny-bind-and-cloned-mount-operations","name":"CVE-2026-78410-nsisolated11158469-2-deny-bind-and-cloned-mount-operations","type":"Microsoft.NetworkSecurity/neuroShields/protectedResources/mitigations","properties":{"findingId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.NetworkSecurity/neuroShields/ns-isolated-cuap-1113-8469/protectedResources/nsisolated11158469-2/findings/CVE-2026-78410-nsisolated11158469-2","cveId":"CVE-2026-78410","virtualMachineArmId":"/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/satyaTestRG/providers/Microsoft.Compute/virtualMachines/nsisolated11158469-2","rank":4,"commandsSummary":"Block
